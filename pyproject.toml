[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "r2o"
version = "1.0.0"
description = "R2O: Rate / Rhythm / Order temporal-process fidelity for generated event streams"
authors = [{name = "Parham Hamouni"}, {name = "Ebrahim Bagheri"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "scipy>=1.8"]

[tool.setuptools]
packages = ["r2o"]
